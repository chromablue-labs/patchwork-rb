name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}, jwt ${{ matrix.jwt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        ruby: [ "3.1", "3.3" ]
        jwt: [ "~> 2.10.3", "~> 3.2" ]
    env:
      JWT_VERSION: ${{ matrix.jwt }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install
        run: bundle install
      - name: Tests
        run: bundle exec rake test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: The ref must be a tag matching lib/patchwork/version.rb
        run: |
          version=$(ruby -r./lib/patchwork/version -e 'print Patchwork::VERSION')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "ref $GITHUB_REF_NAME does not match version $version — release from a matching tag"
            exit 1
          fi
      - name: Install
        run: bundle install
      - name: Build the gem
        run: bundle exec rake build
      - name: Nothing but lib, README and LICENSE ships
        run: |
          unexpected=$(tar -xOf pkg/patchwork-rb-*.gem data.tar.gz | tar -tzf - \
            | grep -vE '^(lib/|README\.md$|LICENSE$)' || true)
          if [ -n "$unexpected" ]; then echo "unexpected files in the gem:"; echo "$unexpected"; exit 1; fi

  release:
    name: Push to RubyGems
    needs: [ test, package ]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install
        run: bundle install
      - uses: rubygems/release-gem@v1
