name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}, jwt ${{ matrix.jwt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: [ "3.1", "3.3" ]
        jwt: [ "~> 2.10.3", "~> 3.2" ]
    env:
      JWT_VERSION: ${{ matrix.jwt }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Install
        run: bundle install
      - name: Tests
        run: bundle exec rake test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install
        run: bundle install
      - name: Build the gem
        run: gem build patchwork-rb.gemspec
      - name: Read the tarball
        run: tar -xOf patchwork-rb-*.gem data.tar.gz | tar -tzf -
      - name: Nothing but lib, README and LICENSE ships
        run: |
          unexpected=$(tar -xOf patchwork-rb-*.gem data.tar.gz | tar -tzf - \
            | grep -vE '^(lib/|README\.md$|LICENSE$)' || true)
          if [ -n "$unexpected" ]; then echo "unexpected files in the gem:"; echo "$unexpected"; exit 1; fi
